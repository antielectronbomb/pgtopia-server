	"Toggle RTD plugin"
	{
		"type"			"list"
		"vote"			"1"
		"minimum"		"0"
		"ratio"			"0.6"
		"command"		"sm_rcon sm plugins {OPTION_RESULT} rtd.smx"
		"options"
		{
			"Toggle ON"						"load"
			"Toggle OFF"					"unload"
		}
		"start_notify"	"[SM] {VOTER_NAME} ({VOTER_STEAMID}) started a vote to toggle the Roll The Dice (RTD) plugin. 60% votes required."
		"call_notify"	"[SM] Vote cast for {yes|no}."
		"pass_notify"	"[SM] Vote passed. Roll The Dice plugin is set to: {OPTION_NAME}."
		"fail_notify"	"[SM] Vote failed. Received: {VOTE_AMOUNT} Required: {VOTE_REQUIRED}"
		"chattrigger"	"votertd"
	}
	"Toggle instant respawn"
