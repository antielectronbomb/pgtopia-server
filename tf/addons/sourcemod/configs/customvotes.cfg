		"pass_notify"	"[SM] Vote passed. Disable respawn times is set to: {OPTION_NAME}."
		"fail_notify"	"[SM] Vote failed. Received: {VOTE_AMOUNT} Required: {VOTE_REQUIRED}"
		"chattrigger"	"voterespawn"
	}
